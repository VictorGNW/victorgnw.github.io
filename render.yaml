services:
  - type: web
    name: achados-do-lourdes
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: achados-dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: CONFIAR_PROXY
        value: sim
      - key: BACKUPS_MANTER
        value: 14
      - key: SENHA_COORDENACAO
        sync: false
