services:
  - type: web
    name: achados-do-lourdes
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CONFIAR_PROXY
        value: sim
      - key: BACKUPS_MANTER
        value: 14
      - key: SENHA_COORDENACAO
        sync: false
